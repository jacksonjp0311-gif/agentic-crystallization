name: Prepare research assets
on: workflow_dispatch
permissions:
  contents: read
jobs:
  historical-fixture:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/restore_test_archive.py --draft
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v4
        with:
          name: historical-fixture
          path: docs/archive/Agentic_Crystallization_1.9_VERIFIED.zip
          retention-days: 1
  package:
    needs: historical-fixture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install . build
      - uses: actions/download-artifact@v4
        with:
          name: historical-fixture
          path: docs/archive
      - run: python scripts/restore_test_archive.py
      - run: python -m unittest discover -s tests -q
      - run: python scripts/research_verify.py
      - run: python -m build
      - run: python scripts/package.py
      - uses: actions/upload-artifact@v4
        with:
          name: research-preview
          path: dist/
