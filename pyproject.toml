[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-crystallization"
version = "2.4.0rc1"
description = "Conditional finite-horizon evidence certification; synthetic research preview"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3"]
authors = [{name = "Agentic Crystallization contributors"}]

[tool.setuptools.packages.find]
where = ["src"]
